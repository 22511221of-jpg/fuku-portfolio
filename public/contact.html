<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT | Web design FUKU</title>
  <meta name="description" content="Web design FUKUへのお問い合わせ。ホームページ制作・LP制作・ロゴデザイン・更新保守サポートのご相談・お見積りは無料です。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo" aria-label="Web design FUKU TOP">
        <img src="/fuku-logo-full.png" alt="Web design FUKU" class="logo-full">
        <img src="/fuku-icon-f.png" alt="FUKU" class="logo-icon">
      </a>
      <button class="hamburger" id="hamburger" aria-label="メニューを開く">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <nav class="drawer" id="drawer">
    <a href="/">TOP</a>
    <a href="/works.html">WORKS</a>
    <a href="/about.html">ABOUT</a>
    <a href="/service.html">SERVICE</a>
    <a href="/contact.html">CONTACT</a>
  </nav>

  <section class="page-header">
    <div class="container">
      <span class="section-tag fade">Contact</span>
      <h1 class="fade delay-1">お問い合わせ</h1>
    </div>
  </section>

  <section>
    <div class="container">
      <p class="contact-lead fade">
        ホームページのこと、ちょっと聞いてみたいな、という気持ちで大丈夫です。<br>
        相談・お見積りは無料ですので、お気軽にご連絡ください。お待ちしています。
      </p>

      <form class="contact-form fade delay-1" action="https://formspree.io/f/xqeogwvj" method="POST">
        <div class="form-group">
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label>お問い合わせ項目</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="topic" value="hp"> ホームページ制作</label>
            <label><input type="checkbox" name="topic" value="lp"> LP制作</label>
            <label><input type="checkbox" name="topic" value="logo"> ロゴデザイン</label>
            <label><input type="checkbox" name="topic" value="support"> 更新・保守サポート</label>
            <label><input type="checkbox" name="topic" value="other"> その他</label>
          </div>
        </div>
        <div class="form-group">
          <label for="message">お問い合わせ内容</label>
          <textarea id="message" name="message" rows="6"></textarea>
        </div>
        <input type="hidden" name="_next" value="https://fuku-portfolio-mocha.vercel.app/contact.html">
        <button type="submit" class="btn btn-fill">送信する</button>
      </form>

      <div class="contact-divider fade delay-2">OR</div>

      <div class="contact-methods fade delay-3">
        <a href="mailto:fuku.designs.jp@gmail.com" class="contact-method">
          <span class="contact-method-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M3.5 5.5L12 13L20.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>fuku.designs.jp@gmail.com</span>
        </a>
        <a href="https://www.instagram.com/fuku__designs" target="_blank" rel="noopener noreferrer" class="contact-method">
          <span class="contact-method-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/>
            </svg>
          </span>
          <span>@fuku__designs</span>
        </a>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-logo-circle"><img src="/fuku-logo-full.png" alt="Web design FUKU"></div>
    <p class="footer-tag">想いをカタチに、幸福を届けるWebデザイン</p>
    <div class="footer-social">
      <a href="https://www.instagram.com/fuku__designs" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/>
        </svg>
      </a>
    </div>
    <nav class="footer-nav">
      <a href="/">TOP</a>
      <a href="/works.html">WORKS</a>
      <a href="/about.html">ABOUT</a>
      <a href="/service.html">SERVICE</a>
      <a href="/contact.html">CONTACT</a>
    </nav>
    <p class="footer-copy">&copy; 2026 Web design FUKU. All Rights Reserved.</p>
  </footer>

  <script src="/main.js"></script>
</body>
</html>
